/** tiny pin glyph (base at x,y; s = px per 1/100 pin-height … s*100*15 px tall) */

      ctx.moveTo(P.top.x - w0, y0); ctx.lineTo(P.top.x + w0, y0);
      ctx.lineTo(P.base.x + P.w * 0.75 * spread, y1); ctx.lineTo(P.base.x - P.w * 0.75 * spread, y1); ctx.closePath(); ctx.fill();
    }
    // coloured ring flash on the deck when the pin comes on
    const fl = S.tau[i] > 0 ? 1 - seg(S.tau[i], 0, 0.9, ease.out) : 0;
    if (fl > 0.01) {
      const u = 1 - fl, rx = P.w * (0.65 + 1.25 * u);
      ctx.save(); ctx.shadowColor = `rgba(${G.glow},${0.9 * fl})`; ctx.shadowBlur = 22;
      ctx.strokeStyle = `rgba(${G.glow},${0.42 * fl * S.out})`; ctx.lineWidth = 2 + 4 * fl;
      ctx.beginPath(); ctx.ellipse(P.base.x, P.base.y + 2, rx, rx * 0.63, 0, 0, 7); ctx.stroke(); ctx.restore();
    }
  }
  ctx.restore();
}

function drawDeckLabels(S) {
  // which pins belong to which evidence group (left wall; the right side is Instagram's button column)
  const a = 1;
  const blocks = [
    { g: 0, y: (PINS2D[0].top.y + PINS2D[4].base.y) / 2 - 8, head: 'BACK 7', lines: ['pooled'] },
    { g: 1, y: (PINS2D[7].top.y + PINS2D[9].base.y) / 2 + 26, head: 'FRONT 3', lines: ['individual', 'studies'] },
  ];
  ctx.save(); ctx.globalAlpha = a; ctx.textBaseline = 'alphabetic';
  for (const b of blocks) {
    const G = GROUPS[b.g], h = 40 + b.lines.length * 32, y0 = b.y - h / 2, col = `rgb(${G.glow})`;
    ctx.fillStyle = 'rgba(5,12,15,0.55)'; rr(ctx, 60, y0 - 12, 142, h + 22, 10); ctx.fill();
    ctx.fillStyle = col; ctx.fillRect(60, y0 - 12 + 10, 4, h + 2);
    ctx.font = '400 36px Anton'; ctx.fillStyle = col; draw(ctx, b.head, 76, y0 + 30);
    ctx.font = '600 30px "Barlow Condensed"'; ctx.fillStyle = '#efe4cc';
    b.lines.forEach((l, i) => draw(ctx, l, 76, y0 + 30 + 34 + i * 31));
  }
  ctx.restore();
}

function drawLampBar(S) {
  const y = HOUSE.y + HOUSE.h - 2;
  const g = ctx.createLinearGradient(0, y, 0, y + 14); g.addColorStop(0, '#2a2f31'); g.addColorStop(0.4, '#c9d0d2'); g.addColorStop(1, '#3b4245');
  ctx.fillStyle = g; rr(ctx, 150, y, 780, 13, 6); ctx.fill();
  for (let i = 0; i < 10; i++) {
    const P = PINS2D[i], k = clamp(0.25 * S.lit[i] + 0.75 * S.spotK[i]);
    ctx.fillStyle = '#15181a'; rr(ctx, P.top.x - 13, y + 2, 26, 15, 5); ctx.fill();
    ctx.fillStyle = rgba(Kit.mix('#4a4436', '#fff1d0', k), 1); rr(ctx, P.top.x - 9, y + 9, 18, 7, 3); ctx.fill();
    if (k > 0.02) { const gg = ctx.createRadialGradient(P.top.x, y + 14, 0, P.top.x, y + 14, 46); gg.addColorStop(0, `rgba(255,236,196,${0.55 * k})`); gg.addColorStop(1, 'rgba(255,236,196,0)'); ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = gg; ctx.fillRect(P.top.x - 46, y - 32, 92, 92); ctx.restore(); }
  }
}

function drawRows(S) {
  for (let i = 0; i < 10; i++) {
    const f = FACTORS[i], R = ROWS[i], G = GROUPS[f.g], ta = S.tau[i], o = S.out;
    const base = R.cy + 14;
    const pop = seg(ta, 0, 0.32, ease.outBack), nameU = seg(ta, 0.06, 0.5, ease.out), pillU = seg(ta, 0.28, 0.62, ease.outBack), pillA = seg(ta, 0.28, 0.5), vsU = seg(ta, 0.52, 0.85), subU = seg(ta, 0.85, 1.25, ease.out);
    // active row wash
    if (S.act[i] > 0.01) { ctx.fillStyle = rgba(G.ink, 0.13 * S.act[i]); rr(ctx, SCR.x + 10, R.y + 2, SCR.w - 20, R.h - 3, 8); ctx.fill(); }
    // number badge
    const bx = PADL + 22, on = clamp(pop) * o;
    ctx.save(); ctx.translate(bx, R.cy); const sc = 1 + 0.18 * Math.sin(Math.PI * clamp(seg(ta, 0, 0.45))) * (ta > 0 ? 1 : 0); ctx.scale(sc, sc);
    ctx.beginPath(); ctx.arc(0, 0, 19, 0, 7);
    ctx.fillStyle = rgba(Kit.mix('#eadbb8', G.ink, on), 1); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = rgba(Kit.mix('#b9a57c', G.ink, on), 1); ctx.stroke();
    ctx.font = F.badge; ctx.fillStyle = rgba(Kit.mix('#a8956c', CREAM, on), 1); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(String(i + 1), 0, 11.5);
    ctx.restore();
    if (ta <= 0 || o < 0.01) {                                   // empty score-sheet line
      ctx.strokeStyle = 'rgba(120,96,56,0.28)'; ctx.lineWidth = 2; ctx.setLineDash([3, 9]); ctx.beginPath(); ctx.moveTo(NAME_X, base - 8); ctx.lineTo(PADR - 4, base - 8); ctx.stroke(); ctx.setLineDash([]);
      continue;
    }
    if (o < 1) { ctx.save(); ctx.globalAlpha = 1 - o; ctx.strokeStyle = 'rgba(120,96,56,0.28)'; ctx.lineWidth = 2; ctx.setLineDash([3, 9]); ctx.beginPath(); ctx.moveTo(NAME_X, base - 8); ctx.lineTo(PADR - 4, base - 8); ctx.stroke(); ctx.setLineDash([]); ctx.restore(); }
    ctx.save(); ctx.globalAlpha = o;
    // name: wipes in from the left
    ctx.save(); ctx.beginPath(); ctx.rect(NAME_X - 4, R.y, (R.nw + 12) * nameU, ROW_H); ctx.clip();
    ctx.font = F.name(R.ns); ctx.fillStyle = INK; draw(ctx, f.name, NAME_X, base); ctx.restore();
    // favourable side: solid pill in the evidence colour
    if (pillA > 0) {
      ctx.save(); ctx.globalAlpha = o * pillA; ctx.translate(R.pillX + R.pw / 2, R.cy); ctx.scale(lerp(0.7, 1, pillU), lerp(0.7, 1, pillU));
      ctx.fillStyle = G.ink; rr(ctx, -R.pw / 2, -19.5, R.pw, 39, 9); ctx.fill();
      ctx.font = F.fav; ctx.fillStyle = '#fff6e2'; draw(ctx, f.fav, -R.pw / 2 + 13, 12.5); ctx.restore();
    }
    // the other side, dimmed
    if (vsU > 0) { ctx.save(); ctx.globalAlpha = o * vsU; ctx.font = F.vs; ctx.fillStyle = DIM; draw(ctx, 'vs ' + f.vs, R.vsX, base - 1); ctx.restore(); }
    if (f.sub && subU > 0) {
      ctx.save(); ctx.globalAlpha = o * subU; ctx.font = F.subl; ctx.fillStyle = G.ink;
      const sy = R.y + ROW_H + SUB_H - 12; ctx.fillRect(R.pillX + 2, sy - 22, 3, 24); ctx.fillStyle = '#3a3226'; draw(ctx, f.sub, R.pillX + 14, sy - (1 - subU) * 6); ctx.restore();
    }
    ctx.restore();
  }
}

function drawCounter(S) {
  // "n / 10" + pindicator triangle in the header
  const o = S.out, n = S.n, col = (k) => (k === 0 ? '#b7a47d' : GROUPS[k >= 8 ? 1 : 0].ink);
  ctx.textBaseline = 'alphabetic';
  ctx.font = F.of; ctx.fillStyle = INK; ctx.textAlign = 'right'; ctx.fillText('/10', PADR, Y.title);
  const ow = ctx.measureText('/10').width, nx = PADR - ow - 8;
  const u = n > 0 ? seg(S.tau[n - 1], 0, 0.32, ease.out) : 1;
  ctx.save(); ctx.beginPath(); ctx.rect(nx - 150, Y.title - 92, 156, 100); ctx.clip();
  ctx.font = F.count; ctx.textAlign = 'right';
  if (n === 0 || o < 1) { ctx.globalAlpha = n === 0 ? 1 : 1 - o; ctx.fillStyle = col(0); ctx.fillText('0', nx, Y.title); }
  if (n > 0) {
    if (u < 1) { ctx.globalAlpha = (1 - u) * o; ctx.fillStyle = col(n - 1); ctx.fillText(String(n - 1), nx, Y.title - 64 * u); }
    ctx.globalAlpha = u * o; ctx.fillStyle = col(n); ctx.fillText(String(n), nx, Y.title + 64 * (1 - u));
  }
  ctx.restore();
  const cx = nx - 224, cy = Y.title - 82, dx = 27, dy = 23;
  // pindicator
  const P = [[-1.5, 0], [-0.5, 0], [0.5, 0], [1.5, 0], [-1, 1], [0, 1], [1, 1], [-0.5, 2], [0.5, 2], [0, 3]];
  for (let i = 0; i < 10; i++) {
    const k = clamp(seg(S.tau[i], 0, 0.3)) * o, GG = GROUPS[FACTORS[i].g], x = cx + P[i][0] * dx, y = cy + P[i][1] * dy;
    const pulse = S.tau[i] > 0 ? 1 - seg(S.tau[i], 0, 0.7, ease.out) : 0;
    if (pulse > 0.01) { ctx.fillStyle = rgba(GG.ink, 0.25 * pulse); ctx.beginPath(); ctx.arc(x, y, 9 + 12 * (1 - pulse), 0, 7); ctx.fill(); }
    ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fillStyle = rgba(Kit.mix('#e6d6b0', GG.ink, k), 1); ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = rgba(Kit.mix('#b9a57c', GG.ink, k), 1); ctx.stroke();
  }
}

function drawStripPulse(S) {
  // the evidence strip of the group that is being dealt glows a little
  [Y.strip0, Y.strip1].forEach((sy, gi) => {
    const first = gi === 0 ? 0 : 7, ta = S.tau[first];
    const k = (ta > -0.25 ? seg(ta, -0.25, 0.15) * (1 - seg(ta, 0.6, 1.5)) : 0) * S.out;
    if (k < 0.01) return;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,240,210,${0.28 * k})`; rr(ctx, SCR.x + 10, sy, SCR.w - 20, STRIP_H, 7); ctx.fill(); ctx.restore();
    ctx.strokeStyle = rgba(GROUPS[gi].ink, 0.6 * k); ctx.lineWidth = 3; rr(ctx, SCR.x + 7, sy - 3, SCR.w - 14, STRIP_H + 6, 9); ctx.stroke();
  });
}

function render(t) {
  const S = stateAt(t);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(BG, 0, 0);
  drawAlley(S);
  drawDeckLabels(S);
  drawBeams(S);
  drawLampBar(S);
  ctx.drawImage(HUD, 0, 0);
  drawStripPulse(S);
  drawRows(S);
  drawCounter(S);
  // glass sheen over the display
  ctx.save(); rr(ctx, SCR.x, SCR.y, SCR.w, SCR.h, 10); ctx.clip();
  const gl = ctx.createLinearGradient(SCR.x, SCR.y, SCR.x + SCR.w * 0.8, SCR.y + SCR.h); gl.addColorStop(0, 'rgba(255,255,255,0.10)'); gl.addColorStop(0.28, 'rgba(255,255,255,0.0)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gl; ctx.fillRect(SCR.x, SCR.y, SCR.w, SCR.h); ctx.restore();
  // vignette + film grain (static)
  const vg = ctx.createRadialGradient(W / 2, 980, 620, W / 2, 980, 1250); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.imageSmoothingEnabled = true; ctx.drawImage(GRAIN, 0, 0, W, H); ctx.restore();
}

window.REEL = {
  title: 'Ten factors · healing after periapical surgery',
  duration: DUR,
  poster: 27.8,
  canvas,
  fonts: ['400 96px Anton', '500 32px "Barlow Condensed"', '600 36px "Barlow Condensed"', '700 40px "Barlow Condensed"'],
  setup() {
    layout();
    alley = buildAlley({ W, H: GL_H, cam: CAM, pins: PIN_XZ.map((p, i) => ({ ...p, label: String(i + 1), band: GROUPS[FACTORS[i].g].band })) });
    PINS2D = PIN_XZ.map((p) => {
      const top = alley.project(p.x, 15, p.z), base = alley.project(p.x, 0, p.z), side = alley.project(p.x + 2.38, 4.5, p.z), mid = alley.project(p.x, 4.5, p.z);
      return { top: { x: top.x, y: top.y + GL_TOP }, base: { x: base.x, y: base.y + GL_TOP }, w: (side.x - mid.x) * 2 };
    });
    BG = paintBG(); HUD = paintHUD(); GRAIN = paintGrain();
    LAYER.dark = grab(-1, -1);
  },
  render,
};
Kit.boot(REEL);
</script>
