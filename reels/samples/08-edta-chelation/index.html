<body>
<div id="stage"></div>
<script type="module">
/*
 * Sample 08 — "3-D molecular render": EDTA wraps a Ca²⁺ ion pulled from a toy apatite surface
 * (ball-and-stick, glossy CPK spheres, studio light, fog), an in-camera ×10⁴ zoom-out to a schematic canal wall
 * where the smear layer is removed and tubules open, a time-lapse (10 min EDTA, then NaOCl) shows erosion,
 * and a takeaway card over the slowly orbiting Ca–EDTA complex that loops back into the title.
 * Output: one 2-D canvas (REEL.canvas). Each frame: 2-D backdrop -> three.js render(s) blitted -> 2-D type.
 */
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildComplex } from './chem.js';

const { clamp, lerp, seg, env, ease, W, H } = Kit;
const TAU = Math.PI * 2;
const { canvas: out, ctx } = Kit.createCanvas();
const CXX = 512;   // caption centre: keeps text clear of the Reels button column (x > 960)

/* ============================== palette & type ============================== */
const UI = {
  ink: '#f2f6fb', dim: '#a9b8ca', faint: '#7d8ea3', ca: '#3fe6b8', n: '#8aa2ff', o: '#ff7a6b',
  warn: '#ffad5c', organic: '#ff8fbd', glass: 'rgba(9,13,20,0.74)',
};
const SANS = 'Inter, "DejaVu Sans", sans-serif';
const CPK = { C: 0x3d4148, H: 0xf4f4f2, N: 0x3b62f2, O: 0xe3342a, Ca: 0x2bd9a6, P: 0xff9020 };
const RAD = { C: 0.40, H: 0.24, N: 0.43, O: 0.41, Ca: 0.70, P: 0.50 };
const BOND_R = 0.15;

/* ============================== timeline (s) ============================== */
const T = {
  dur: 25.7,
  hook: [0, 3.15],
  target: [3.1, 5.3], capA: [3.15, 5.4],
  dock: [5.3, 5.95], claw: [5.9, 8.3], capB: [5.45, 9.15],
  hold: [8.3, 9.35],                                   // climax hold: cage closed, title, poster
  drift: [9.3, 11.5], capC: [9.1, 11.95],
  xfade: [11.55, 12.35],                               // in-camera zoom-out Å -> µm
  smear: [12.35, 15.6], capD: [12.4, 15.55], clock: [12.45, 14.95],
  erode: [15.6, 17.4],                                 // time-lapse: EDTA 1 -> 10 min
  naocl: [17.4, 18.45], capE: [15.75, 19.85],          // then NaOCl: erosion
  card: [19.8, 25.7],
};
const FADE = 0.25;   // caption fade; every caption is fully visible >= Kit.readSecs(text) (audit in NOTES.md)
const ARM_ORDER = [0, 2, 1, 3];              // carboxylate arm closing order (alternating sides)
const armWin = (k) => { const i = ARM_ORDER.indexOf(k); const a = T.claw[0] + 0.1 + i * 0.42; return [a, a + 0.9]; };
const oBondT = (k) => armWin(k)[0] + 0.75;   // carboxylate O→Ca bond forms near end of swing
const N_BOND_T = [8.1, 8.22];                // amine N bind last (at pH 7.5 an N carries the proton; order illustrative)
const LOCK = 8.3;                            // sixth bond: "lock" accent

/* ============================== renderer ============================== */
const glc = document.createElement('canvas'); glc.width = W; glc.height = H;
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, alpha: true, preserveDrawingBuffer: true, premultipliedAlpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.08;
renderer.setClearColor(0x000000, 0);
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------- shared helpers ---------- */
const UP = new THREE.Vector3(0, 1, 0);
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3(), _c = new THREE.Color();
const V = (a) => new THREE.Vector3(a[0], a[1], a[2]);
function glowTexture(inner = 'rgba(255,255,255,1)', mid = 'rgba(255,255,255,0.35)') {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, inner); gr.addColorStop(0.25, mid); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const GLOW = glowTexture();
function glowSprite(color, size) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true, opacity: 0 }));
  s.scale.set(size, size, 1); return s;
}
function glossy(extra = {}) {
  return new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.07, envMapIntensity: 0.85, ...extra });
}
function setBondHalf(mesh, idx, a, b, r) { // half-cylinder from point a to point b
  _p.set((a.x + b.x) / 2, (a.y + b.y) / 2, (a.z + b.z) / 2);
  const d = new THREE.Vector3().subVectors(b, a); const L = d.length();
  _q.setFromUnitVectors(UP, d.multiplyScalar(1 / (L || 1)));
  _s.set(r, L, r); _m.compose(_p, _q, _s); mesh.setMatrixAt(idx, _m);
}
function setAtom(mesh, idx, p, r) { _q.identity(); _s.set(r, r, r); _m.compose(p, _q, _s); mesh.setMatrixAt(idx, _m); }
function lights(scene, keyI = 2.5, rimI = 2.3) {
  const key = new THREE.DirectionalLight(0xfff1e2, keyI); key.position.set(-9, 15, 11); scene.add(key);
  const rim = new THREE.DirectionalLight(0x86c8ff, rimI); rim.position.set(8, 5, -13); scene.add(rim);
  const fill = new THREE.HemisphereLight(0xbcd6ff, 0x1c140e, 0.55); scene.add(fill);
  scene.environment = envTex;
}
const sph = (tgt, dist, el, az) => new THREE.Vector3(tgt.x + dist * Math.cos(el) * Math.sin(az), tgt.y + dist * Math.sin(el), tgt.z + dist * Math.cos(el) * Math.cos(az));

/* ============================== molecular scene (Å) ============================== */
const sceneM = new THREE.Scene();
sceneM.fog = new THREE.Fog(0x0b121b, 34, 84);
lights(sceneM);
const camM = new THREE.PerspectiveCamera(34, W / H, 0.5, 1500);

const CX = buildComplex();
const EL = CX.atoms.map((a) => a.el);
const NA = EL.length;
const heavyCentroid = (P) => { const c = new THREE.Vector3(); let n = 0; P.forEach((p, i) => { if (i && EL[i] !== 'H') { c.x += p[0]; c.y += p[1]; c.z += p[2]; n++; } }); return c.multiplyScalar(1 / n); };
const CEN_OPEN = heavyCentroid(CX.open), CEN_CLOSED = heavyCentroid(CX.closed);
const CLOSED_POSE = CX.pose([0, 0, 0, 0]);
const sphereHi = new THREE.SphereGeometry(1, 40, 28);
const sphereLo = new THREE.SphereGeometry(1, 18, 12);
const cylHi = new THREE.CylinderGeometry(1, 1, 1, 22, 1, true);
const cylLo = new THREE.CylinderGeometry(1, 1, 1, 10, 1, true);

// ---- the hero EDTA molecule (dynamic; Ca drawn separately) ----
const mol = new THREE.Group(); sceneM.add(mol);
const molMat = glossy();
const atomsM = new THREE.InstancedMesh(sphereHi, molMat, NA);
const bondsM = new THREE.InstancedMesh(cylHi, molMat, CX.bonds.length * 2);
for (let i = 0; i < NA; i++) atomsM.setColorAt(i, _c.setHex(CPK[EL[i]]));
CX.bonds.forEach(([i, j], k) => { bondsM.setColorAt(2 * k, _c.setHex(CPK[EL[i]])); bondsM.setColorAt(2 * k + 1, _c.setHex(CPK[EL[j]])); });
mol.add(atomsM, bondsM);
// coordination "dashes": 6 bonds x 5 dashes, unlit glow
const DASH_N = 5;
const dashMat = new THREE.MeshBasicMaterial({ color: 0xa8fff0, toneMapped: false, transparent: true, opacity: 0.95, depthWrite: false });
const dashes = new THREE.InstancedMesh(new THREE.CylinderGeometry(1, 1, 1, 10, 1, false), dashMat, 6 * DASH_N);
dashes.renderOrder = 2; mol.add(dashes);
const donorGlow = CX.coord.map(() => { const s = glowSprite(0x8ffff0, 2.6); mol.add(s); return s; });
// the target Ca2+ (world space; belongs to the surface, then to the complex)
const caMat = glossy({ emissive: new THREE.Color(0x0a4a39), emissiveIntensity: 0.0 });
const caIon = new THREE.Mesh(sphereHi, caMat); caIon.scale.setScalar(RAD.Ca * 1.05); sceneM.add(caIon);
caMat.color.setHex(CPK.Ca);
const caGlow = glowSprite(0x3fffc8, 7); sceneM.add(caGlow);
const vacGlow = glowSprite(0x3fffc8, 5.5); sceneM.add(vacGlow);

// ---- toy apatite slab: Ca2+ + PO4(3-) tetrahedra, 1.5 layers (schematic, no OH-) ----
const LAT_A = 4.3, R3 = Math.sqrt(3);
const latPt = (i, j) => [i * LAT_A + j * LAT_A / 2, j * LAT_A * R3 / 2];
const SITE = new THREE.Vector3(0, 1.25, 0);   // target Ca2+ (hollow site above the top layer)
const latGroup = new THREE.Group(); sceneM.add(latGroup);
const LATTICE_MAT = glossy({ roughness: 0.32, clearcoat: 0.45, envMapIntensity: 0.55 });
(function buildApatite() {
  const ca = [], P = [], O = [], bonds = [];
  const off = [-LAT_A, -LAT_A * R3 / 3];       // puts a down-triangle centroid at the origin
  const RMAX = 25;
  const inView = (x, z) => Math.hypot(x, z) < RMAX;
  const fall = (p) => { const r = Math.hypot(p[0], p[2]); const f = clamp((RMAX - r) / (RMAX - 7)); return 0.16 + 0.84 * f * f * (3 - 2 * f); };
  const rnd = Kit.rng(808);
  for (let i = -14; i <= 14; i++) for (let j = -16; j <= 12; j++) {
    const [lx, lz] = latPt(i, j); const x = lx + off[0], z = lz + off[1];
    if (inView(x, z)) ca.push([x, 0, z]);
    const ux = x + LAT_A / 2, uz = z + LAT_A * R3 / 6;            // up-triangle centroid -> phosphate
    if (inView(ux, uz)) {
      const p = [ux, -0.3, uz]; P.push(p);
      const phi = rnd() * TAU, b = 1.54;
      const ap = [p[0], p[1] + b, p[2]]; O.push(ap); bonds.push([p, ap]);
      for (let k = 0; k < 3; k++) {
        const a = phi + k * TAU / 3;
        const o = [p[0] + b * 0.943 * Math.cos(a), p[1] - b * 0.333, p[2] + b * 0.943 * Math.sin(a)];
        O.push(o); bonds.push([p, o]);
      }
    }
    const dx = x + LAT_A, dz = z + LAT_A * R3 / 3;                // down-triangle centroid -> lower Ca
    if (inView(dx, dz)) ca.push([dx, -2.9, dz]);
  }
  const mat = LATTICE_MAT;
  const dimC = (hex, p, k = 0.72) => _c.setHex(hex).multiplyScalar(k * fall(p));
  const make = (list, el) => {
    const m = new THREE.InstancedMesh(sphereLo, mat, list.length);
    list.forEach((p, i) => { setAtom(m, i, V(p), RAD[el] * (el === 'Ca' ? 0.82 : el === 'O' ? 0.78 : 0.85)); m.setColorAt(i, dimC(CPK[el], p, el === 'Ca' ? 0.62 : 0.72)); });
    latGroup.add(m);
  };
  make(ca, 'Ca'); make(P, 'P'); make(O, 'O');
  const bm = new THREE.InstancedMesh(cylLo, mat, bonds.length * 2);
  bonds.forEach(([a, b], k) => {
    const A = V(a), B = V(b), M = A.clone().add(B).multiplyScalar(0.5);
    setBondHalf(bm, 2 * k, A, M, 0.1); setBondHalf(bm, 2 * k + 1, M, B, 0.1);
    bm.setColorAt(2 * k, dimC(CPK.P, a)); bm.setColorAt(2 * k + 1, dimC(CPK.O, a));
  });
  latGroup.add(bm);
})();
// soft contact shadow under the hero molecule
const shadowTex = glowTexture('rgba(0,0,0,0.9)', 'rgba(0,0,0,0.45)');
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false, opacity: 0, fog: true }));
shadow.rotation.x = -Math.PI / 2; shadow.position.y = 1.36; shadow.renderOrder = 1; latGroup.add(shadow);

/* ---------- molecular choreography ---------- */
// arm openness: one "claw flex" in the hook (promise), then the four carboxylate arms close one by one
const armU = (t) => {
  const flex = 1 - 0.45 * Math.sin(Math.PI * ease.inOut(seg(t, 0.15, 1.1)));
  return [0, 1, 2, 3].map((k) => { const [a, b] = armWin(k); return Math.min(flex, 1 - ease.inOut(seg(t, a, b))); });
};
const liftT = (t) => ease.inOut(seg(t, T.dock[1] - 0.05, T.claw[1] + 0.25));   // Ca pulled out of the lattice
function molPlacement(t) {
  // complex origin (= Ca site) and orientation
  const hoverY = 9.6 + 0.25 * Math.sin(t * 1.6);
  const descend = ease.inOut(seg(t, T.target[0], T.dock[0] + 0.1));
  const dock = ease.inOut(seg(t, T.dock[0], T.dock[1]));
  let y = lerp(hoverY, SITE.y + 3.2, descend);
  y = lerp(y, SITE.y, dock);
  y += 2.3 * liftT(t);
  const pos = new THREE.Vector3(0, y, 0);
  const dr = ease.inOut(seg(t, T.drift[0], T.drift[1] + 0.6));
  pos.x += -2.2 * dr; pos.y += 5.2 * dr; pos.z += 1.6 * dr;
  const spin = lerp(-1.25, 0.42, ease.inOut(seg(t, 0, T.dock[0] + 0.2))) + 0.55 * dr + 0.18 * seg(t, T.dock[1], T.drift[0]);
  const tilt = 0.32 * (1 - ease.inOut(seg(t, 1.9, T.dock[0]))) + 0.35 * dr;
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(tilt, spin, 0.22 * dr, 'YXZ'));
  return { pos, q };
}
function camMState(t) {
  // spherical camera: target, distance, elevation, azimuth
  const { pos: mp, q } = molPlacement(t);
  const k0 = ease.outQuint(seg(t, 0, 1.0));                                   // hook push-in
  const k1 = ease.inOut(seg(t, T.target[0] - 0.2, T.target[0] + 1.3));       // tilt down to the crystal
  const k2 = ease.inOut(seg(t, T.dock[0] - 0.8, T.claw[0] + 0.05));          // close-up: finished before the arms move
  const kH = ease.inOut(seg(t, T.hold[0] - 0.05, T.hold[1] + 0.15));         // reveal orbit around the closed cage
  const k3 = ease.inOut(seg(t, T.drift[0] - 0.1, T.drift[1]));               // pull back as the complex leaves
  const kz = ease.inOut(seg(t, T.xfade[0], T.xfade[1]));                     // in-camera x10^4 zoom-out
  const tgt = CEN_OPEN.clone().applyQuaternion(q).add(mp).add(new THREE.Vector3(0, -0.9, 0));  // molecule at y≈880
  tgt.lerp(new THREE.Vector3(0, 3.1 + 0.45 * Math.max(0, mp.y - SITE.y - 3.2), 0), k1);   // tilt down, but keep the descending molecule clear of the header
  tgt.lerp(new THREE.Vector3(mp.x, mp.y - 0.9, mp.z), k2 * (1 - k3));
  tgt.lerp(new THREE.Vector3(-0.9, 6.5, 0.5), k3);
  tgt.lerp(mp, kz);
  let dist = lerp(60, 37, k0); dist = lerp(dist, 46, k1); dist = lerp(dist, 30, k2); dist = lerp(dist, 52, k3);
  dist *= Math.pow(400 / 52, kz);
  let el = lerp(0.10, 0.36, k1); el = lerp(el, 0.17, k2); el = lerp(el, 0.30, k3);
  const az = 0.32 + 0.05 * t + 0.55 * k2 + 0.6 * kH + 0.3 * k3;
  return { tgt, dist, el, az };
}

// ---- background complexes leaving other sites (opaque, darker, smaller, deeper in the fog) ----
const staticMat = glossy(); staticMat.color.setScalar(0.5);
function makeStaticComplex() {
  const g = new THREE.Group();
  const P = CX.closed.map(V);
  const am = new THREE.InstancedMesh(sphereLo, staticMat, NA);
  const bm = new THREE.InstancedMesh(cylLo, staticMat, CX.bonds.length * 2);
  for (let i = 0; i < NA; i++) { am.setColorAt(i, _c.setHex(CPK[EL[i]])); setAtom(am, i, P[i], RAD[EL[i]]); }
  CX.bonds.forEach(([i, j], k) => {
    const m = P[i].clone().add(P[j]).multiplyScalar(0.5);
    setBondHalf(bm, 2 * k, P[i], m, BOND_R); setBondHalf(bm, 2 * k + 1, m, P[j], BOND_R);
    bm.setColorAt(2 * k, _c.setHex(CPK[EL[i]])); bm.setColorAt(2 * k + 1, _c.setHex(CPK[EL[j]]));
  });
  g.add(am, bm); return g;
}
const AWAY = (() => { const az = camMState(10.3).az; return new THREE.Vector3(-Math.sin(az), 0, -Math.cos(az)); })();
const others = [[-5, 2, 1.3, 0.3], [-4, 4, -0.8, 0.0], [-4, 0, 2.4, -0.25]].map(([i, j, rot, tilt], k) => {
  const g = makeStaticComplex(); const [x, z] = latPt(i, j);
  g.userData = { base: new THREE.Vector3(x, 1.25, z).addScaledVector(AWAY, 6), rot, tilt, k };
  sceneM.add(g); return g;
});
const otherVac = others.map(() => { const s = glowSprite(0x3fffc8, 4.5); sceneM.add(s); return s; });

const tmpPos = Array.from({ length: NA }, () => new THREE.Vector3());
const worldOf = (local) => local.clone().applyQuaternion(mol.quaternion).add(mol.position);
let MOLSTATE = null;
function setPose(P) {
  for (let i = 0; i < NA; i++) tmpPos[i].set(P[i][0], P[i][1], P[i][2]);
  for (let i = 0; i < NA; i++) { if (i === 0) { _m.makeScale(0, 0, 0); atomsM.setMatrixAt(0, _m); } else setAtom(atomsM, i, tmpPos[i], RAD[EL[i]]); }
  CX.bonds.forEach(([i, j], k) => {
    const m = tmpPos[i].clone().add(tmpPos[j]).multiplyScalar(0.5);
    setBondHalf(bondsM, 2 * k, tmpPos[i], m, BOND_R); setBondHalf(bondsM, 2 * k + 1, m, tmpPos[j], BOND_R);
  });
  atomsM.instanceMatrix.needsUpdate = true; bondsM.instanceMatrix.needsUpdate = true;
}
function setDashes(vis) {
  CX.coord.forEach(([ci, di], b) => {
    const a = tmpPos[ci], d = tmpPos[di], dir = d.clone().sub(a); const L = dir.length(); dir.normalize();
    const s0 = RAD.Ca + 0.12, s1 = L - RAD[EL[di]] - 0.08, span = Math.max(0.01, s1 - s0);
    for (let k = 0; k < DASH_N; k++) {
      const seg0 = s0 + span * (k / DASH_N), seg1 = s0 + span * ((k + 0.55) / DASH_N);
      const grow = clamp(vis[b] * DASH_N - (DASH_N - 1 - k)); // grows from donor toward Ca
      const r = 0.075 * grow;
      const A = a.clone().addScaledVector(dir, seg0), B = a.clone().addScaledVector(dir, seg1);
      if (r < 0.004) { _m.makeScale(0, 0, 0); dashes.setMatrixAt(b * DASH_N + k, _m); }
      else setBondHalf(dashes, b * DASH_N + k, A, B, r);
    }
  });

}
function placeCam(c) {
  camM.position.copy(sph(c.tgt, c.dist, c.el, c.az));
  camM.lookAt(c.tgt); camM.updateMatrixWorld(true);
  sceneM.fog.near = c.dist - 4; sceneM.fog.far = c.dist + 34;
}
function updateMol(t) {
  latGroup.visible = true;
  setPose(CX.pose(armU(t)));
  const { pos, q } = molPlacement(t);
  mol.position.copy(pos); mol.quaternion.copy(q);
  mol.updateMatrixWorld(true);
  // Ca ion: on the surface until docking, then rides in the complex
  const docked = t >= T.dock[1] - 0.02;
  const caW = docked ? pos.clone() : SITE.clone();
  caIon.position.copy(caW);
  const pulse = 0.5 + 0.5 * Math.sin((t - T.target[0]) * 5.2);
  const tg = env(t, T.target[0] + 0.3, T.claw[1], 0.4, 0.6);
  const lock = Math.sin(Math.PI * seg(t, LOCK - 0.1, LOCK + 0.4));            // 0 -> 1 -> 0 accent on the 6th bond
  caGlow.position.copy(caW);
  caGlow.material.opacity = 0.6 * (tg * (0.35 + 0.35 * pulse) + 0.25 * env(t, T.claw[1] - 0.2, T.drift[1] + 1, 0.3, 0.5)) + 0.3 * lock;
  caGlow.scale.setScalar(6 + 1.5 * pulse * tg + 3 * lock);
  caMat.emissiveIntensity = Math.min(0.6, 0.15 + 0.45 * tg * pulse + 0.3 * lock);
  // coordination bonds: the four carboxylate O first, the two amine N last
  const formT = [N_BOND_T[0], N_BOND_T[1], ...[0, 1, 2, 3].map(oBondT)];
  const vis = formT.map((ft) => ease.out(seg(t, ft - 0.18, ft + 0.12)));
  setDashes(vis);
  CX.coord.forEach(([, di], b) => {
    const flash = env(t, formT[b] - 0.05, formT[b] + 0.55, 0.08, 0.45);
    donorGlow[b].position.copy(tmpPos[di]); donorGlow[b].material.opacity = 0.75 * flash;
    donorGlow[b].scale.setScalar(2.2 + 1.6 * flash);
  });
  // vacancy left behind
  vacGlow.position.copy(SITE); vacGlow.material.opacity = 0.55 * ease.out(seg(t, T.drift[0] + 0.2, T.drift[0] + 1.0)) * (0.8 + 0.2 * Math.sin(t * 4));
  // contact shadow under the approaching molecule
  const sh = clamp(1 - (pos.y - SITE.y) / 12);
  shadow.visible = true;
  shadow.position.set(pos.x, 1.36, pos.z); shadow.scale.setScalar(lerp(8, 13, 1 - sh)); shadow.material.opacity = 0.55 * sh * sh * (1 - seg(t, T.drift[0], T.drift[0] + 1.5));
  // background complexes emerge (scale 0 -> 0.8, opaque) from far-side sites after the hero leaves
  others.forEach((g, k) => {
    const { base, rot, tilt } = g.userData;
    const a = T.drift[0] + 0.15 + 0.35 * k, r = ease.inOut(seg(t, a, a + 2.6));
    const sc = 0.8 * ease.outBack(seg(t, a, a + 0.6));

/* ---------- timer dial for the dentine scenes ---------- */
const TP95 = T.erode[0] + 0.05 + 0.768 * (T.erode[1] - 0.15 - T.erode[0]);   // time-lapse reaches ~10 min
function dial(t, a) {
  if (a <= 0) return;
  const cx = 884, cy = 336, R = 66;
  const p1 = seg(t, T.clock[0], T.clock[1]);                                   // 0..60 s
  const p2 = ease.inOut(seg(t, T.erode[0] + 0.05, T.erode[1] - 0.1));         // 1 -> 10 min
  const pN = ease.inOut(seg(t, T.naocl[0], T.naocl[0] + 0.35));               // then NaOCl
  const secs = p2 > 0 ? 60 + p2 * 540 : p1 * 60;
  const mm = Math.floor(secs / 60), ss = Math.floor(secs % 60);
  const col = Kit.rgba(Kit.mix(Kit.mix(UI.ca, UI.warn, clamp(p2 * 3)), UI.organic, pN));
  const sweet = env(t, T.clock[1] - 0.02, T.erode[0] + 0.05, 0.12, 0.2);     // 1-min sweet spot
  ctx.save(); ctx.globalAlpha *= a;
  ctx.fillStyle = 'rgba(8,12,18,0.78)'; ctx.beginPath(); ctx.arc(cx, cy, R + 14, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineCap = 'round';
  if (sweet > 0) { ctx.shadowColor = 'rgba(63,230,184,0.9)'; ctx.shadowBlur = 24 * sweet; }
  const frac = p2 > 0 ? (p2 >= 1 ? 1 : (secs / 60) % 1) : p1;
  ctx.beginPath(); ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + TAU * Math.max(0.001, frac)); ctx.stroke();
  ctx.restore();
  const clk = `${mm}:${String(ss).padStart(2, '0')}`;   // "10:00" is shrunk to stay clear of the ring stroke
  rich(clk, cx, cy + 13, { size: fitSize(clk, 38, 94, 800), weight: 800, alpha: a, color: p2 > 0 ? col : UI.ink });
  const ty = cy + R + 58, bg = 'rgba(8,11,16,0.85)';
  const tag = (txt, color, aa, y = ty, sc = 1) => {
    if (aa <= 0) return;

  tag('time-lapse ▸▸', UI.warn, env(t, T.erode[0] + 0.05, TP95, 0.15, 0.15));

}

/* ============================== frame ============================== */
function blit(alpha) { if (alpha <= 0) return; ctx.save(); ctx.globalAlpha = alpha; ctx.drawImage(glc, 0, 0); ctx.restore(); }
function render(t) {
  t = clamp(t, 0, T.dur - 1e-4);
  background(t);
  const x0 = T.xfade[0], c0 = T.card[0];
  const intro = ease.inOut(seg(t, 0, 0.25));                                     // loop seam: molecule fades in
  const endA = ease.inOut(seg(t, T.dur - 0.5, T.dur - 0.05));                    // ... and the card fades back to the title
  const zx = ease.inOut(seg(t, x0, x0 + 0.8));                                   // overlapping cross-fade (never black)
  const mA = intro * (1 - zx);
  const cIn = ease.inOut(seg(t, c0, c0 + 0.6));
  const dA = zx * (1 - cIn);
  const kA = cIn * (1 - endA);
  if (mA > 0) {
    updateMol(t);
    renderer.toneMappingExposure = 1.08;
    renderer.render(sceneM, camM); blit(mA);
  }
  if (dA > 0) {
    updateDent(t);
    renderer.toneMappingExposure = 0.43;
    renderer.render(sceneD, camD); blit(dA);
  }
  if (kA > 0) {
    updateMolCard(t);
    renderer.toneMappingExposure = 1.08;
    renderer.render(sceneM, camM); blit(kA);
  }
  naoclSweep(t);
  bottomShade(1 - dA, lerp(0.5, 0.85, dA));
  overlays(t, mA, dA, endA);
  card(t, kA);
  // zoom tag across the cut

}
