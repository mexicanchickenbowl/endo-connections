<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>00 · Template</title>
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<script src="../../lib/kit.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
// Minimal contract demo: one full-frame canvas, render(t) draws the frame for time t (seconds).
const { canvas, ctx } = Kit.createCanvas();
const { seg, ease, W, H } = Kit;
window.REEL = {
  title: 'Template',
  duration: 6,
  canvas,                                   // whole frame lives on this canvas -> fast capture path
  fonts: ['700 72px "Space Grotesk"', '400 30px Inter'],
  render(t) {
    ctx.fillStyle = '#0d0f14'; ctx.fillRect(0, 0, W, H);
    const a = seg(t, 0.2, 1.0, ease.out);
    ctx.globalAlpha = a; ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = '700 72px "Space Grotesk"'; ctx.fillText('Template reel', W / 2, 420 - 30 * (1 - a));
    ctx.font = '400 30px Inter'; ctx.fillStyle = '#9aa3b2'; ctx.fillText('render(t) is a pure function of time', W / 2, 480);
    ctx.globalAlpha = 1;
    const p = seg(t, 1, 5, ease.inOut);
    ctx.strokeStyle = '#6a9cff'; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(W / 2, 960, 260, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2); ctx.stroke();
    ctx.font = '700 120px "Space Grotesk"'; ctx.fillStyle = '#fff'; ctx.fillText(Math.round(p * 100) + '%', W / 2, 1000);
    Kit.handle(ctx, W / 2, 1540, { align: 'center', color: '#9aa3b2' });
  },
};
Kit.boot(REEL);
</script>
</body>
</html>
