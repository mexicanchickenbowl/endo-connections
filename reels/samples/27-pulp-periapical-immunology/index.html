function view(t) {
  let v = PAGE;
  for (const m of MOVES) {
    if (t >= m.t1) { v = m.b; continue; }

// ---------- captions ----------

const CAPS = [

    src: 'Farges 2015, Mediators Inflamm (review)' },
  { rich: ['No immune access. A protected ', ['bacterial reservoir', 'M1', 1.0], '.'],
    page: ['No immune access'],

  { rich: [['Macrophages', 'P1', 0.95], ', ', ['T', 'C1', 1.35], ' + ', ['B cells', 'B1', 1.6], ', ', ['plasma cells', 'B1', 1.8], '.'],
    page: [['Macrophages', 'P1'], ', ', ['T', 'C1'], ' + ', ['B', 'B1'], ', ', ['plasma cells', 'B1']],

    src: 'Graves 2011, J Oral Microbiol (review) \u00b7 schematic' },

const layCache = {};
function richLayout(rich, font, maxW) {

// ---------- panels on the page ----------

  const WT = [Z, 0, 0, Z, cam.tx, cam.ty], world = () => ctx.setTransform(...WT);

  ctx.drawImage(paper, 0, 0);
  X.use(ctx); X.mode(false);
  world(); furniture(); masthead(Z); banner(t, WT);
  for (let i = 0; i < 6; i++) drawPanel(i, t, cam);
  const k = Z * S0;
  // label that belongs to the close-up only ('mostly IgG' would be 11 px on the whole page)
  const aT = clamp((Z - 1.75) / 0.5);
  if (aT > 0.004 && t > ARR[3]) faded(aT, [k, 0, 0, k, RECT[3].x * Z + cam.tx, RECT[3].y * Z + cam.ty], () => Panels.overlay(3, ctx, t - ARR[3]));
  X.use(ctx); X.mode(false);
  // close-up lettering lives in panel space and leaves with the camera; the page lettering (30 px) comes up
  // only after the takeaway is complete, so the two never overlap
  for (let i = 0; i < 5; i++) {
    const aC = seg(t, ARR[i], ARR[i] + 0.2) * clamp((k - 0.74) / 0.18) * (1 - seg(t, MOVES[i + 1].t0, MOVES[i + 1].t0 + 0.25));
    faded(aC, [k, 0, 0, k, RECT[i].x * Z + cam.tx, RECT[i].y * Z + cam.ty], () => capClose(i, t, aC));
  }
  const aP = seg(t, TPC, TPC + 0.3) * clamp((1.75 - Z) / 0.5) * (1 - textOut(t));
  faded(aP, WT, () => { for (let i = 0; i < 5; i++) capPage(i); });
  world(); ctx.globalAlpha = 1; roundels(t);
  // handle in the gutter under the panel while reading close up (on the page it sits in the masthead strip)
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const ah = clamp((Z - 2.82) / 0.08);                         // only while the camera rests on a panel
  if (ah > 0) { ctx.globalAlpha = ah * 0.8; ctx.fillStyle = INK.K; ctx.font = '700 24px "Comic Neue"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('@natebrooksendo', W / 2, CY + PH + 21); ctx.globalAlpha = 1; }
}

window.REEL = {
  title: 'The tooth fights back',
  duration: D,
  poster: D - 1.1,
  canvas,
  fonts: ['400 100px Bangers', '700 48px "Comic Neue"', '700 30px "Comic Neue"', '700 24px "Comic Neue"'],
  setup() {
    Panels.init();
    paper = makePaper();
    layer = document.createElement('canvas'); layer.width = W; layer.height = H; lctx = layer.getContext('2d');
    // fit the masthead title to the box
    ctx.save(); ctx.font = '400 100px Bangers'; try { ctx.letterSpacing = '3.5px'; } catch (e) { /* */ }
    const w = ctx.measureText('THE TOOTH FIGHTS BACK!').width; try { ctx.letterSpacing = '0px'; } catch (e) { /* */ } ctx.restore();
    mastFS = Math.min(108, Math.floor((100 * 884) / w));
    for (let i = 0; i < 6; i++) {
      const f = document.createElement('canvas'); f.width = PW; f.height = PH; Panels.render(i, f.getContext('2d'), Panels.dur[i], false); FINAL[i] = f;
      const p = document.createElement('canvas'), q = 0.62; p.width = Math.round(PW * q); p.height = Math.round(PH * q);
      const g = p.getContext('2d'); g.fillStyle = '#f8f2e4'; g.fillRect(0, 0, p.width, p.height); g.scale(p.width / PW, p.height / PH); Panels.render(i, g, Panels.dur[i], true); PENCIL[i] = p;
    }
    X.use(ctx); X.mode(false);
  },
  render,
};
Kit.boot(REEL);
</script>
